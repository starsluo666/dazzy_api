[project]
name = "dazzy-api"
version = "0.1.0"
description = "DAZZY platform API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.6,<5.7",
  "cos-python-sdk-v5>=1.9.44",
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "djangorestframework-simplejwt>=5.5,<5.6",
  "drf-spectacular>=0.28,<0.29",
  "pillow>=11,<12",
  "psycopg[binary]>=3.2,<3.3",
  "redis>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.10,<5",
  "ruff>=0.12,<0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
